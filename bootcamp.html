<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Bootcamp — Tree Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #f5f4ef;
    color: #1a1a2a;
    height: 100vh;
    overflow: hidden;
  }

  .bootcamp {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* --- Dialogue bar --- */
  .dialogue-bar {
    background: #2a2a3a;
    color: #eee;
    padding: 12px 20px;
    font-size: 17px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 3px solid #3a3a4a;
  }
  .dialogue-bar .speaker {
    font-weight: 700;
    color: #e090d0;
    white-space: nowrap;
  }

  /* --- Controls row: answer | tiles | nav --- */
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    flex-shrink: 0;
    border-bottom: 1px solid #ddd;
    background: #f5f4ef;
    position: relative;
  }

  .answer-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .answer-group input {
    width: 58px;
    padding: 8px 10px;
    font-size: 18px;
    text-align: center;
    border: 2px solid #ccc;
    border-radius: 6px;
    outline: none;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #1a1a2a;
  }
  .answer-group input::placeholder {
    color: #bbb;
    font-style: italic;
  }
  .answer-group input:focus { border-color: #6aaa64; }
  .answer-group button {
    padding: 8px 16px;
    font-size: 15px;
    cursor: pointer;
    background: #e8e8e3;
    color: #444;
    border: 2px solid #ccc;
    border-radius: 6px;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 500;
    transition: background 0.15s;
  }
  .answer-group button:hover { background: #ddd; }
  .answer-group .feedback {
    font-size: 14px;
    min-width: 60px;
  }

  .tiles-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  .wordle-tile {
    width: 48px;
    height: 48px;
    border-radius: 5px;
    border: 2px solid rgba(0,0,0,0.12);
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .wordle-tile:hover { opacity: 0.85; }
  .wordle-tile:active { transform: scale(0.95); }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }
  .nav-group .label {
    font-size: 13px;
    font-weight: 500;
    color: #888;
    white-space: nowrap;
  }
  .nav-group button {
    width: 32px;
    height: 32px;
    font-size: 14px;
    font-weight: 600;
    border: 2px solid #ccc;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #555;
    transition: all 0.15s;
  }
  .nav-group button:hover { border-color: #999; }
  .nav-group button.active {
    background: #2a2a3a;
    color: white;
    border-color: #2a2a3a;
  }
  .nav-group button.locked {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* --- Tree SVG --- */
  .tree-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
    overflow: hidden;
  }
  .tree-zone svg {
    max-width: 100%;
    max-height: 100%;
  }

  /* --- Bottom: counter --- */
  .bottom-zone {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 0 16px;
    border-top: 1px solid #ddd;
    background: #f5f4ef;
  }
  .counter {
    font-size: 22px;
    font-weight: 700;
    color: #e67e22;
  }

  /* --- Boring button --- */
  .boring-btn {
    position: absolute;
    left: 28%;
    transform: translateX(-50%);
    padding: 6px 14px; font-size: 13px; cursor: pointer;
    background: #f0e8e0; color: #886; border: 2px solid #ddc;
    border-radius: 6px; font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 500; font-style: italic; transition: background 0.15s;
    white-space: nowrap;
    z-index: 5;
  }
  .boring-btn:hover { background: #e8ddd0; }

  /* --- Click-here hint for lesson 1 --- */
  .click-hint {
    position: absolute;
    left: calc(50% + 40px);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 18px;
    font-weight: 600;
    color: #e67e22;
    animation: hint-pulse 1.5s ease-in-out infinite;
    pointer-events: none;
    white-space: nowrap;
  }
  .click-hint .hint-arrow {
    font-size: 20px;
  }
  @keyframes hint-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* --- Cutscene overlay --- */
  .cutscene {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a2a; display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .cutscene-content {
    max-width: 600px; padding: 40px; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
  }
  .cutscene-content .cs-speaker {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 18px; font-weight: 700;
  }
  .cutscene-content .cs-text {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 20px; color: #eee; line-height: 1.6;
  }
  .cutscene-content .cs-hint {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 13px; color: rgba(150,150,150,0.5);
    margin-top: 12px;
  }

  /* --- Power mode (x3 interface) --- */
  .power-zone {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; padding: 20px;
  }
  .power-chain {
    display: flex; align-items: center; gap: 10px;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 24px; font-weight: 600; color: #333;
    flex-wrap: wrap; justify-content: center;
  }
  .power-chain .x3-box {
    background: #6aaa64; color: white; padding: 8px 16px;
    border-radius: 6px; font-size: 20px; font-weight: 700;
    cursor: default;
  }
  .power-chain .x3-btn {
    background: #e8e8e3; color: #555; padding: 8px 16px;
    border-radius: 6px; font-size: 20px; font-weight: 700;
    cursor: pointer; border: 2px solid #ccc; transition: background 0.15s;
  }
  .power-chain .x3-btn:hover { background: #ddd; }
  .power-chain .equals { color: #888; }
  .power-chain .result { color: #2a2a3a; font-size: 28px; }
  .power-expr {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 18px; color: #888;
  }
  .power-answer {
    display: flex; align-items: center; gap: 8px;
  }
  .power-answer input {
    width: 80px; padding: 8px 10px; font-size: 18px; text-align: center;
    border: 2px solid #ccc; border-radius: 6px; outline: none;
    font-family: 'DM Sans', system-ui, sans-serif;
  }
  .power-answer input:focus { border-color: #6aaa64; }
  .power-answer button {
    padding: 8px 16px; font-size: 15px; cursor: pointer;
    background: #e8e8e3; color: #444; border: 2px solid #ccc; border-radius: 6px;
    font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500;
  }
  .power-answer button:hover { background: #ddd; }
  .power-answer .feedback { font-size: 14px; }

  /* --- Phase selector --- */
  .phase-select {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 24px;
    background: #1a1a2a;
  }
  .phase-select h2 {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 22px; color: #e090d0; font-weight: 700;
  }
  .phase-select .phase-buttons {
    display: flex; gap: 20px;
  }
  .phase-select .phase-btn {
    padding: 16px 32px; font-size: 17px; font-weight: 600;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #2a2a3a; color: #eee; border: 2px solid #4a4a5a;
    border-radius: 10px; cursor: pointer; transition: all 0.15s;
    text-align: center; line-height: 1.5;
  }
  .phase-select .phase-btn:hover { background: #3a3a4a; border-color: #6a6a7a; }
  .phase-select .phase-btn.locked {
    opacity: 0.35; cursor: not-allowed;
  }
  .phase-select .phase-desc {
    font-size: 13px; color: #888; margin-top: 4px;
  }

  /* --- Mobile --- */
  @media (max-width: 600px) {
    .dialogue-bar { font-size: 14px; padding: 10px 14px; }
    .controls-row { padding: 10px 12px; }
    .wordle-tile { width: 36px; height: 36px; }
    .answer-group input { width: 46px; font-size: 15px; padding: 6px 6px; }
    .answer-group button { font-size: 13px; padding: 6px 10px; }
    .nav-group .label { font-size: 11px; }
    .nav-group button { width: 28px; height: 28px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="bootcamp" id="app"></div>

<script>
const COLORS = ['green', 'yellow', 'gray'];
const HEX = { green: '#6aaa64', yellow: '#c9b458', gray: '#787c7e', empty: '#ddd' };
const STROKE = { green: '#5a9a54', yellow: '#b9a448', gray: '#686c6e', empty: '#bbb' };

const PROMPTS = {
  1: '"Your first assignment: How many ways are there to color a single square in a Wordle pattern?"',
  2: '"OK, great. You got the warm-up. Big whoop. Now, how many different ways are there to color TWO Wordle squares, Mr. Smarty Pants?"',
  3: '"Now we\'re cooking. How many ways to color THREE squares? Think about it."',
  4: '"Four squares now. You seeing the pattern yet?"',
};

const MAX_N = 4;
let highestUnlocked = 1;
let currentN = 1;
let curColors = [];
let visited = new Set();
let totalVisited = 0;
let nodes = [];
let svgEl = null;
let counterEl = null;
let feedbackEl = null;

function startLesson(N) {
  currentN = N;
  curColors = Array(N).fill('green');
  visited = new Set();
  totalVisited = 0;
  nodes = [];

  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="dialogue-bar">
      <span class="speaker">Carol B</span>
      <span id="dialogueText">${PROMPTS[N]}</span>
    </div>
    <div class="controls-row">
      <div class="answer-group">
        <input type="text" id="ansInput" placeholder="?">
        <button onclick="submitAnswer()">Answer</button>
        <span class="feedback" id="feedback"></span>
      </div>
      ${N >= 4 ? '<button class="boring-btn" onclick="boringEscape()">Uh... Carol? It\'s getting boring to count...</button>' : ''}
      <div class="tiles-row" id="tilesRow"></div>
      ${N === 1 ? '<div class="click-hint"><span class="hint-arrow">\u2190</span> click the tile!</div>' : ''}
      <div class="nav-group" id="navGroup">
        <span class="label"># tiles:</span>
      </div>
    </div>
    <div class="tree-zone" id="treeZone"></div>
    <div class="bottom-zone">
      <div class="counter" id="counter">0 combinations found</div>
    </div>
  `;

  // Build nav buttons with lock state
  const navGroup = document.getElementById('navGroup');
  for (let i = 1; i <= MAX_N; i++) {
    const btn = document.createElement('button');
    btn.textContent = i;
    btn.id = 'nav' + i;
    if (i === N) btn.classList.add('active');
    if (i > highestUnlocked) btn.classList.add('locked');
    const level = i;
    btn.addEventListener('click', () => {
      if (level <= highestUnlocked) startLesson(level);
    });
    navGroup.appendChild(btn);
  }

  counterEl = document.getElementById('counter');
  feedbackEl = document.getElementById('feedback');

  const tilesRow = document.getElementById('tilesRow');
  for (let t = 0; t < N; t++) {
    const tile = document.createElement('div');
    tile.className = 'wordle-tile';
    tile.style.background = HEX.green;
    tile.dataset.color = 'green';
    tile.addEventListener('click', () => cycleTile(tile, t));
    tilesRow.appendChild(tile);
  }

  buildTree(N);

  document.getElementById('ansInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
  });
  document.getElementById('ansInput').focus();
}

function cycleTile(tile, idx) {
  const cur = tile.dataset.color;
  const next = COLORS[(COLORS.indexOf(cur) + 1) % 3];
  tile.dataset.color = next;
  tile.style.background = HEX[next];
  curColors[idx] = next;
  updateTree();
}

function buildTree(N) {
  const treeZone = document.getElementById('treeZone');
  const isMobile = window.innerWidth <= 600;

  const leafCount = Math.pow(3, N);

  // Node radius — consistent within each lesson
  let nodeR;
  if (isMobile) {
    nodeR = N === 1 ? 10 : N === 2 ? 7 : N === 3 ? 5 : 2;
  } else {
    nodeR = N === 1 ? 12 : N === 2 ? 10 : N === 3 ? 8 : 3;
  }

  const ringGap = N <= 3 ? 4 : 2;
  const ringR = nodeR + ringGap;

  // SVG coordinate width — scale up for large N so dots aren't crushed
  const refWidth = isMobile ? 320 : (N <= 3 ? 700 : 1200);

  // KEY RULE: equal gaps everywhere including edges
  // leafCount items need leafCount+1 equal gaps across the full width
  // gap = refWidth / (leafCount + 1)
  // leaf i center = gap * (i + 1)
  const leafGap = refWidth / (leafCount + 1);

  const levelHeight = N === 1 ? 0 : (isMobile ? 50 : 70);
  const svgH = (N - 1) * levelHeight + ringR * 2 + 4;

  // Compute positions
  const positions = [];

  // Leaves: equally distributed with edge gaps
  const leafY = (N - 1) * levelHeight + ringR + 2;
  const leafPositions = [];
  for (let i = 0; i < leafCount; i++) {
    leafPositions.push({ x: leafGap * (i + 1), y: leafY });
  }
  positions[N - 1] = leafPositions;

  // Parents centered above their 3 children
  for (let level = N - 2; level >= 0; level--) {
    const count = Math.pow(3, level + 1);
    const y = level * levelHeight + ringR + 2;
    const childLevel = positions[level + 1];
    const parentPositions = [];
    for (let i = 0; i < count; i++) {
      const c0 = childLevel[i * 3];
      const c2 = childLevel[i * 3 + 2];
      parentPositions.push({ x: (c0.x + c2.x) / 2, y });
    }
    positions[level] = parentPositions;
  }

  // Create SVG
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${refWidth} ${svgH}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.style.maxWidth = '100%';
  svg.style.maxHeight = '100%';
  svgEl = svg;

  // Lines
  for (let level = 0; level < N - 1; level++) {
    const parents = positions[level];
    const children = positions[level + 1];
    for (let i = 0; i < parents.length; i++) {
      for (let j = 0; j < 3; j++) {
        const child = children[i * 3 + j];
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', parents[i].x);
        line.setAttribute('y1', parents[i].y);
        line.setAttribute('x2', child.x);
        line.setAttribute('y2', child.y);
        line.setAttribute('stroke', '#ddd');
        line.setAttribute('stroke-width', '1.5');
        line.dataset.parentLevel = level;
        line.dataset.parentIdx = i;
        line.dataset.childIdx = i * 3 + j;
        svg.appendChild(line);
      }
    }
  }

  // Nodes
  nodes = [];
  for (let level = 0; level < N; level++) {
    const levelNodes = [];
    for (let i = 0; i < positions[level].length; i++) {
      const pos = positions[level][i];

      const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      ring.setAttribute('cx', pos.x);
      ring.setAttribute('cy', pos.y);
      ring.setAttribute('r', ringR);
      ring.setAttribute('fill', 'none');
      ring.setAttribute('stroke', 'transparent');
      ring.setAttribute('stroke-width', '2.5');
      svg.appendChild(ring);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', pos.x);
      circle.setAttribute('cy', pos.y);
      circle.setAttribute('r', nodeR);
      circle.setAttribute('fill', HEX.empty);
      circle.setAttribute('stroke', STROKE.empty);
      circle.setAttribute('stroke-width', '1.5');
      svg.appendChild(circle);

      levelNodes.push({
        color: 'empty',
        el: circle,
        ringEl: ring
      });
    }
    nodes.push(levelNodes);
  }

  treeZone.appendChild(svg);
  updateTree();
}

function getPathIndices(colors) {
  const indices = [];
  for (let level = 0; level < colors.length; level++) {
    let idx = 0;
    for (let i = 0; i <= level; i++) {
      idx += COLORS.indexOf(colors[i]) * Math.pow(3, level - i);
    }
    indices.push(idx);
  }
  return indices;
}

function updateTree() {
  const key = curColors.join(',');
  const pathIndices = getPathIndices(curColors);

  if (!visited.has(key)) {
    visited.add(key);
    totalVisited++;
    for (let level = 0; level < currentN; level++) {
      const node = nodes[level][pathIndices[level]];
      const color = curColors[level];
      node.color = color;
      node.el.setAttribute('fill', HEX[color]);
      node.el.setAttribute('stroke', STROKE[color]);
    }
    counterEl.textContent = `${totalVisited} combination${totalVisited !== 1 ? 's' : ''} found`;
  }

  for (let level = 0; level < currentN; level++) {
    for (let i = 0; i < nodes[level].length; i++) {
      nodes[level][i].ringEl.setAttribute('stroke', i === pathIndices[level] ? '#e67e22' : 'transparent');
    }
  }

  if (svgEl) {
    svgEl.querySelectorAll('line').forEach(line => {
      const pLevel = parseInt(line.dataset.parentLevel);
      const pIdx = parseInt(line.dataset.parentIdx);
      const cIdx = parseInt(line.dataset.childIdx);
      const onPath = pIdx === pathIndices[pLevel] && cIdx === pathIndices[pLevel + 1];
      line.setAttribute('stroke', onPath ? '#e67e22' : '#ddd');
      line.setAttribute('stroke-width', onPath ? '2.5' : '1.5');
    });
  }
}

function submitAnswer() {
  const input = document.getElementById('ansInput');
  const total = Math.pow(3, currentN);
  if (input.value.trim() === String(total)) {
    feedbackEl.textContent = 'Correct!';
    feedbackEl.style.color = '#6aaa64';
    input.disabled = true;
    if (currentN < MAX_N) {
      highestUnlocked = Math.max(highestUnlocked, currentN + 1);
      setTimeout(() => startLesson(currentN + 1), 800);
    } else {
      // Phase I complete — show message then go to phase selector
      phase1Complete = true;
      document.getElementById('dialogueText').textContent =
        '"3 × 3 × 3 × 3 = 81. See? Every new square triples the possibilities. Now you\'re thinking like a Wordle player."';
      setTimeout(() => showPhaseSelect(), 2500);
    }
  } else {
    feedbackEl.textContent = 'Try again.';
    feedbackEl.style.color = '#c0392b';
    input.value = '';
    input.focus();
  }
}

// === BORING ESCAPE → Carol cutscene → Power mode ===

function boringEscape() {
  const carolLines = [
    { speaker: 'Carol B', color: '#e090d0', text: '"Lucky for you, there\'s a better way."' },
    { speaker: 'Carol B', color: '#e090d0', text: '"Think about the smaller problems you solved. 3 colorings for one tile. 9 colorings for two tiles. 27 colorings for three tiles. Notice anything?"' },
    { speaker: 'Harry Bonds', color: '#e0c080', text: '"Wait! Those are the powers of 3!"' },
    { speaker: 'Carol B', color: '#e090d0', text: '"Bingo. 9 = 3². 27 = 3³. And in general, the number of ways to color N tiles is 3 to the power N!"' },
    { speaker: 'Harry Bonds', color: '#e0c080', text: '"So...."' },
    { speaker: 'Carol B', color: '#e090d0', text: '"So that means you can tell me the answer for a LOT more tiles, soldier!"' },
  ];
  showCutscene(carolLines, () => startPowerMode());
}

function showCutscene(lines, onDone) {
  const app = document.getElementById('app');
  let idx = 0;

  function render() {
    const line = lines[idx];
    app.innerHTML = `
      <div class="cutscene">
        <div class="cutscene-content">
          <div class="cs-speaker" style="color:${line.color}">${line.speaker}</div>
          <div class="cs-text">${line.text}</div>
          <div class="cs-hint">[SPACE] to continue &nbsp;·&nbsp; [ESC] to exit</div>
        </div>
      </div>
    `;
    document.addEventListener('keydown', advance);
    app.querySelector('.cutscene').addEventListener('click', advance);
  }

  function advance(e) {
    if (e.type === 'keydown' && e.key === 'Escape') {
      document.removeEventListener('keydown', advance);
      exitBootcamp();
      return;
    }
    if (e.type === 'keydown' && e.key !== ' ') return;
    document.removeEventListener('keydown', advance);
    idx++;
    if (idx < lines.length) {
      render();
    } else {
      if (onDone) onDone();
    }
  }

  render();
}

function exitBootcamp() {
  if (window.parent && window.parent.Bootcamp) {
    window.parent.Bootcamp.hide();
  }
}

let powerN = 4;
let powerAsking = 4;

function startPowerMode() {
  powerN = 4;
  powerAsking = 4;
  renderPowerMode();
}

function renderPowerMode() {
  const app = document.getElementById('app');
  const total = Math.pow(3, powerN);
  const boxes = [];
  for (let i = 0; i < powerN; i++) boxes.push('<span class="x3-box">×3</span>');
  if (powerN < 10) boxes.push('<span class="x3-btn" onclick="addX3()">×3</span>');

  app.innerHTML = `
    <div class="bootcamp">
      <div class="dialogue-bar">
        <span class="speaker">Carol B</span>
        <span id="dialogueText">"Now, how many ways to color ${powerAsking} squares?"</span>
      </div>
      <div class="power-zone">
        <div class="power-chain">
          ${boxes.join(' ')}
          <span class="equals">=</span>
          <span class="power-expr">3<sup>${powerN}</sup></span>
          <span class="equals">=</span>
          <span class="result">${total}</span>
        </div>
        <div class="power-answer">
          <input type="text" id="powerInput" placeholder="?">
          <button onclick="submitPower()">Answer</button>
          <span class="feedback" id="powerFeedback"></span>
        </div>
      </div>
      <div class="bottom-zone">
        <div class="counter">Click ×3 to add another tile</div>
      </div>
    </div>
  `;
  document.getElementById('powerInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitPower();
  });
  setTimeout(() => {
    const inp = document.getElementById('powerInput');
    if (inp) inp.focus();
  }, 50);
}

function addX3() {
  if (powerN < 10) {
    powerN++;
    renderPowerMode();
  }
}

function submitPower() {
  const input = document.getElementById('powerInput');
  const fb = document.getElementById('powerFeedback');
  const expected = Math.pow(3, powerAsking);
  if (input.value.trim() === String(expected)) {
    fb.textContent = 'Correct!';
    fb.style.color = '#6aaa64';
    input.disabled = true;
    if (powerAsking < 10) {
      powerAsking++;
      setTimeout(() => {
        powerN = Math.max(powerN, powerAsking);
        renderPowerMode();
      }, 600);
    }
    if (powerAsking > 10) {
      // Done — final message about 5 tiles
      setTimeout(() => {
        const carolEnd = [
          { speaker: 'Carol B', color: '#e090d0', text: '"Great. But we really care about 5 tiles. That\'s a full Wordle row."' },
          { speaker: 'Carol B', color: '#e090d0', text: '"You got it. 243 patterns. That\'s what we\'re dealing with."' },
          { speaker: 'Carol B', color: '#e090d0', text: '"Now you know the size of the battlefield. Next time, we figure out how to fight."' },
        ];
        showCutscene(carolEnd, () => {
          if (window.parent && window.parent.Bootcamp) {
            window.parent.Bootcamp.hide();
          }
        });
      }, 800);
    }
  } else {
    fb.textContent = 'Try again.';
    fb.style.color = '#c0392b';
    input.value = '';
    input.focus();
  }
}

let phase1Complete = false;

function showPhaseSelect() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="phase-select">
      <h2>Carol B's Wordle Bootcamp</h2>
      <div class="phase-buttons">
        <button class="phase-btn" onclick="startLesson(1)">
          Phase I<br>
          <span class="phase-desc">Counting Combinations</span>
        </button>
        <button class="phase-btn ${phase1Complete ? '' : 'locked'}" id="phase2Btn"
          onclick="${phase1Complete ? 'boringEscape()' : ''}">
          Phase II<br>
          <span class="phase-desc">Powers of 3</span>
        </button>
      </div>
    </div>
  `;
}

// Check URL param for phase selection (set by bootcamp.js on re-entry)
const params = new URLSearchParams(window.location.search);
if (params.get('phases') === '1') {
  phase1Complete = true;
  showPhaseSelect();
} else {
  startLesson(1);
}
</script>
</body>
